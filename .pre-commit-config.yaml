repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: CHANGELOG.md
      - id: check-yaml
        # Syntax-only. Several managed repositories split YAML anchors across
        # files on purpose, and a strict load fails on the undefined alias.
        # githooks/pre-commit runs --all-files, so without this every local
        # commit in those repositories is blocked.
        args: [--unsafe]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      # Documentation behaviour lives in .terraform-docs.yml, not in flags, so
      # a local run and a CI run read the same committed configuration. The
      # path is relative on purpose: the hook rewrites it to an absolute path
      # from the repository root before entering each module directory.
      #
      # The previous --hook-config args are deliberately gone:
      #   --add-to-existing-file  used the hook's own markers, which appended a
      #                           second documentation block to any README that
      #                           already had terraform-docs markers
      #   --create-file-if-not-exist  created READMEs in examples and test
      #                           fixtures that nobody asked for
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.4.0
    hooks:
      - id: conventional-commits
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.12.0
    hooks:
      - id: gitleaks

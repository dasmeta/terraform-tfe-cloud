# Generated by dasmeta/repository/github. Local edits are overwritten on the
# next apply; change the module input instead.
#
# One config at the repository root governs every module in it. The
# pre-commit-terraform hook rewrites a relative --config path to an absolute
# one from the repository root before it enters each module directory, so this
# file is found everywhere. terraform-docs on its own does not search parent
# directories, which is why the hook passes --config rather than relying on
# discovery.
formatter: markdown table

output:
  file: README.md
  # inject writes between the terraform-docs markers and leaves the rest of the
  # README alone. Files without markers are skipped by the hook, so examples and
  # test fixtures do not acquire generated READMEs.
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: true
  lockfile: false
